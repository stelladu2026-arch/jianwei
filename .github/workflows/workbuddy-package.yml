name: WorkBuddy expert package

on:
  push:
    branches:
      - 'feat/workbuddy-expert-20261106'
    paths:
      - 'integrations/workbuddy/**'
      - '.github/workflows/workbuddy-package.yml'
  pull_request:
    paths:
      - 'integrations/workbuddy/**'
      - '.github/workflows/workbuddy-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run offline contract and packaging tests
        run: python3 -m unittest discover -s integrations/workbuddy/tests -v
      - name: Build review candidate with explicit publication blockers
        run: python3 integrations/workbuddy/package.py --output dist/jianwei-workbuddy-review-0.1.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: jianwei-workbuddy-review
          path: |
            dist/jianwei-workbuddy-review-0.1.0.zip
            dist/jianwei-workbuddy-review-0.1.0.checks.json
            dist/jianwei-workbuddy-review-0.1.0.sha256
          if-no-files-found: error
          retention-days: 30
